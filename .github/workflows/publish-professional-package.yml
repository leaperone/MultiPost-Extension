name: Publish Professional Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag (extension-vX.Y.Z)
        required: true
        type: string
      version:
        description: Extension version (X.Y.Z)
        required: true
        type: string
      expected_sha256:
        description: SHA256 of chrome-mv3-prod.zip (64 hex)
        required: true
        type: string
      source_sha:
        description: Private monorepo commit SHA (40 hex)
        required: true
        type: string

concurrency:
  group: official-chrome-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-chrome:
    name: Publish official build to Chrome Web Store
    runs-on: ubuntu-latest
    env:
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          validate_hex() {
            local value="$1" length="$2"
            [[ "${#value}" -eq "$length" ]] && [[ "$value" =~ ^[0-9a-fA-F]+$ ]]
          }
          if [[ ! "$INPUT_RELEASE_TAG" =~ ^extension-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must match extension-vX.Y.Z"
            exit 1
          fi
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match X.Y.Z"
            exit 1
          fi
          if [[ "$INPUT_RELEASE_TAG" != "extension-v${INPUT_VERSION}" ]]; then
            echo "release_tag does not match version"
            exit 1
          fi
          if ! validate_hex "$INPUT_EXPECTED_SHA256" 64; then
            echo "expected_sha256 must be 64 hex characters"
            exit 1
          fi
          if ! validate_hex "$INPUT_SOURCE_SHA" 40; then
            echo "source_sha must be 40 hex characters"
            exit 1
          fi
          echo "INPUT_EXPECTED_SHA256=$(echo "$INPUT_EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "INPUT_SOURCE_SHA=$(echo "$INPUT_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$INPUT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'chrome-mv3-prod.zip' \
            --pattern 'release-provenance.json' \
            --dir release-assets

      - name: Verify provenance and package
        shell: bash
        run: |
          set -euo pipefail
          zip_path="release-assets/chrome-mv3-prod.zip"
          provenance_path="release-assets/release-provenance.json"
          test -f "$zip_path"
          test -f "$provenance_path"
          actual_sha="$(sha256sum "$zip_path" | awk '{print $1}')"
          if [[ "$actual_sha" != "$INPUT_EXPECTED_SHA256" ]]; then
            echo "chrome-mv3-prod.zip SHA256 mismatch"
            exit 1
          fi
          jq -e \
            --arg repo "leaperone/MultiPost" \
            --arg sha "$INPUT_SOURCE_SHA" \
            --arg version "$INPUT_VERSION" \
            --arg zip_sha "$INPUT_EXPECTED_SHA256" \
            '
              .sourceRepository == $repo
              and (.sourceSha | ascii_downcase) == $sha
              and .version == $version
              and (.professionalSha256 | ascii_downcase) == $zip_sha
            ' "$provenance_path" >/dev/null
          python3 <<'PY'
          import pathlib
          import sys
          import zipfile

          zip_path = pathlib.Path("release-assets/chrome-mv3-prod.zip")
          with zipfile.ZipFile(zip_path) as archive:
              for name in archive.namelist():
                  normalized = pathlib.PurePosixPath(name)
                  if normalized.is_absolute() or ".." in normalized.parts:
                      print(f"unsafe zip path: {name}")
                      sys.exit(1)
              manifest_data = archive.read("manifest.json")
          manifest_path = pathlib.Path("release-assets/manifest.json")
          manifest_path.write_bytes(manifest_data)
          PY
          manifest_path="release-assets/manifest.json"
          jq -e --arg version "$INPUT_VERSION" '.manifest_version == 3 and .version == $version' "$manifest_path" >/dev/null
          jq -e 'has("action") and (has("browser_action") | not)' "$manifest_path" >/dev/null
          if ! jq -e '.host_permissions | index("https://api.undersky.ai/*") != null' "$manifest_path" >/dev/null; then
            echo "manifest must include api.undersky.ai host permission"
            exit 1
          fi
          if jq -r '[.. | strings] | .[]' "$manifest_path" | grep -q 'api.leaper.one'; then
            echo "manifest must not reference api.leaper.one"
            exit 1
          fi
          jq -e '.host_permissions | index("https://*/*") != null' "$manifest_path" >/dev/null

      - name: Upload to Chrome Web Store
        id: chrome_upload
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: release-assets/chrome-mv3-prod.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_EXTENSION_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_EXTENSION_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_EXTENSION_REFRESH_TOKEN }}

      - name: Report Chrome upload step outcome
        if: always()
        shell: bash
        run: |
          echo "chrome_upload step conclusion: ${{ steps.chrome_upload.outcome }}"
          echo "workflow job conclusion: ${{ job.status }}"
