name: Trigger Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT

      - name: Trigger release build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/MultiPost-Desktop-Release
          event-type: release-build
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "platforms": "all"}'
