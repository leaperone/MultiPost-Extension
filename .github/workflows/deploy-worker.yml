name: Trigger Deploy Worker

on:
  push:
    tags:
      - 'worker-v*'
    paths:
      - 'apps/video-stt-worker/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      ref:
        description: '部署的分支或标签'
        required: true
        default: 'main'
      message:
        description: '部署说明'
        required: false
        default: '手动触发部署'
      author:
        description: '触发者'
        required: false
        default: 'manual trigger'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy payload
        id: payload
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_REF="${{ inputs.ref }}"
            INPUT_MESSAGE="${{ inputs.message }}"
            INPUT_AUTHOR="${{ inputs.author }}"
          else
            DEPLOY_REF="${{ github.ref_name }}"
            INPUT_MESSAGE=""
            INPUT_AUTHOR=""
          fi

          commit_message=$(printf '%s' "${{ github.event.head_commit.message || '' }}" | sed -n '1p' | cut -c 1-72)
          input_message=$(printf '%s' "$INPUT_MESSAGE" | sed -n '1p' | cut -c 1-72)
          message="${commit_message:-$input_message}"

          if [ -z "$message" ]; then
            message='Triggered worker deploy'
          fi

          author=$(printf '%s' "${INPUT_AUTHOR:-${{ github.actor }}}" | sed -n '1p')
          escaped_message=$(printf '%s' "$message" | sed 's/["\\]/\\&/g')
          escaped_author=$(printf '%s' "$author" | sed 's/["\\]/\\&/g')

          echo "deploy_ref=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          echo "message=$escaped_message" >> "$GITHUB_OUTPUT"
          echo "author=$escaped_author" >> "$GITHUB_OUTPUT"

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: leaperone/leaperone-releases
          event-type: deploy-multipost
          client-payload: '{
            "ref": "${{ steps.payload.outputs.deploy_ref }}",
            "env": "production",
            "targets": "pve",
            "build_targets": "video-stt-worker",
            "message": "${{ steps.payload.outputs.message }}",
            "author": "${{ steps.payload.outputs.author }}"
          }'
