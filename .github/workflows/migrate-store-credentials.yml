name: Migrate Store Credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt existing Chrome credentials for the private release repository
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_EXTENSION_CLIENT_ID: ${{ secrets.CHROME_EXTENSION_CLIENT_ID }}
          CHROME_EXTENSION_CLIENT_SECRET: ${{ secrets.CHROME_EXTENSION_CLIENT_SECRET }}
          CHROME_EXTENSION_REFRESH_TOKEN: ${{ secrets.CHROME_EXTENSION_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir sealed
          cat > receiver.pub <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwfGSYaJPUP4B6shAW6UT
          s07tdRjsA02p1I9npOF5yb5XlYUM2yIDXncguyG/3QsNBwhJ8dfF5X0h8jcjhrbJ
          HFHHeL1dLHscCT81uMHfpXFH+I+1NKhsXJmDQqKQ/rfpcd30+Y3JBq0R+TNognMW
          1GcuRTUwA5DMhO8biTnIV2B+qoF8RLXePbWyg4C6EOOZSO1vwYio2VENXVx9lNoR
          KrZRpj8vtZAOWdRGxWqK+i2adpn3cwHAm7P9LpCGhxI3eh+XtD++78+QUZrYO2GB
          aYCJrHHPM/z5CtdiuXJP6MMFJ1szUGgX54JbrHypbJY17SKZ0+5huXLz3+NPNUOY
          ME7KwdLSfvt5oacBLHkQFsoCiiOWkNlY8RgwbkqWwKwFy2Sw3l2x8wkV7z7XtnxB
          ktt5aKBYAe6hA7Oo45lvYj8vtM1mSR7Yr7ouDHzXI96B9k/9GjcHBW0iJ6J7MyRS
          balhMlrXW2Vmt675GpoEPIEc0L2fnd5OoLubNjc1+oYBPM4O97moA7XJxm6iZ75Y
          TlfBpu6AzZ4oFv6zJ0JFlUrQXfd8+oa5hX9oKPSwtvm07Drp+y7g9/mN+KaTJdUT
          41r+VPDiBbwj8Ov/J0Nf38dxoaL0SCVT8/fqH9WpJZjVsbleE11T0V8VKVNTlzj9
          h58eTSNfBcEVH7v77fdNhAkCAwEAAQ==
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          python3 <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          names = ['CHROME_EXTENSION_ID', 'CHROME_EXTENSION_CLIENT_ID', 'CHROME_EXTENSION_CLIENT_SECRET', 'CHROME_EXTENSION_REFRESH_TOKEN']
          for name in names:
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit('Missing credential: ' + name)
              subprocess.run(['openssl', 'pkeyutl', '-encrypt', '-pubin', '-inkey', 'receiver.pub', '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256', '-out', 'sealed/' + name + '.sealed'], input=value.encode(), check=True, stdout=subprocess.DEVNULL)
          print('Encrypted four existing Chrome credentials for the designated receiver.')
          PYTHON
      - name: Retain encrypted transfer for one day
        uses: actions/upload-artifact@v4
        with:
          name: sealed-store-credentials
          path: sealed/*.sealed
          retention-days: 1
          if-no-files-found: error
