version: "3.8"
services:
  multipost:
    image: registry.cn-hongkong.aliyuncs.com/leaperone/multipost:latest
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: final
      args:
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
        - NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT}
        - SENTRY_RELEASE=${SENTRY_RELEASE}
    environment:
      - NEXT_PUBLIC_BASE_PATH=https://multipost.app

  multipost-backend:
    image: registry.cn-hongkong.aliyuncs.com/leaperone/multipost:backend-latest
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: backend

  video-stt-worker:
    image: registry.cn-hongkong.aliyuncs.com/leaperone/multipost:video-stt-worker-latest
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: video-stt-worker
